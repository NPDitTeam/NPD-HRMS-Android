org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
# ปิด jetifier: ปลั๊กอินทุกตัวในโปรเจกต์นี้เป็น AndroidX อยู่แล้ว การแปลงไฟล์ engine ของ Flutter
# ไม่มีประโยชน์ แถมกิน RAM จนบิลด์ release ล้ม (JetifyTransform ... Java heap space)
android.enableJetifier=false
android.overridePathCheck=true
